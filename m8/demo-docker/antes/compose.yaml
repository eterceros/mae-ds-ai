# ANTES (escenario K5): depends_on sin condicion y sin healthcheck.
# Version corregida: despues/compose.yaml.
# Compose solo espera a que el contenedor de Postgres haya ARRANCADO, no a que
# acepte conexiones. Sin restart, si la API intenta conectarse antes, muere y
# queda muerta. Tampoco hay servicio de migraciones.
# Usa la imagen s08-docker/api:local que construye despues/compose.yaml
# (o: docker build -f despues/Dockerfile -t s08-docker/api:local api).
name: s08-docker
services:
  postgres:
    image: docker.io/library/postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    environment:
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: tienda
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    image: s08-docker/api:local
    environment:
      PGHOST: postgres
      PGPASSWORD: demo
      PGDATABASE: tienda
    ports: ["127.0.0.1:18100:3000"]
    depends_on:
      - postgres
    restart: "no"
volumes:
  pgdata:

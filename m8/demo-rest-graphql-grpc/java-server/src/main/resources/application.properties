spring.application.name=students-java-server
spring.main.banner-mode=off
logging.level.root=WARN

# Mismas variables que la version Node.
server.address=${HOST:127.0.0.1}
server.port=${HTTP_PORT:3000}

# Conexiones persistentes como en Node: sin tope de peticiones por conexion (Tomcat cierra tras 100 por
# defecto, lo que obligaria al cliente a reconectar) y 65 s de espera, como keepAliveTimeout en src/main.ts.
server.tomcat.max-keep-alive-requests=-1
server.tomcat.keep-alive-timeout=65s

# Sin gzip, como Node por defecto (HTTP_COMPRESSION=on activa gzip solo en Node).
server.compression.enabled=false

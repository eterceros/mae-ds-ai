# Demo de caché (M8, S06). Solo escucha en 127.0.0.1 y en puertos altos para no chocar con nada.
# Levantar: docker compose up -d   |   Borrar todo (contenedores y datos): docker compose down -v
name: m8-demo-cache

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: shop
    ports: ["127.0.0.1:18432:5432"]
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=200
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  redis:
    image: redis:8.10.2
    # Sin persistencia: es una caché y la demo mide memoria y expulsión, no durabilidad.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:18379:6379"]

  valkey:
    image: valkey/valkey:9.1.2
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:18380:6379"]

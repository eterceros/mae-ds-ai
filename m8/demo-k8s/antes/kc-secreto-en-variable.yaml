# KC, antes: la misma api leyendo el Secret como VARIABLE DE ENTORNO.
# Comparar con despues/api.yaml, que monta el mismo Secret como ARCHIVO (/etc/secretos/API_KEY).
# Una réplica y sin Service: solo sirve para comparar cómo ve cada pod un Secret que cambia.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-variable
  namespace: s11
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-variable }
  template:
    metadata:
      labels: { app: api-variable }
    spec:
      containers:
        - name: api
          image: s11-demo/api:1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: api-config }
          env:
            - name: API_KEY                 # se copia al entorno del proceso UNA vez, al arrancar
              valueFrom:
                secretKeyRef: { name: api-secretos, key: API_KEY }
          readinessProbe:
            httpGet: { path: /salud/vivo, port: 3000 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

# "ports:" de Compose -> Gateway API. El Gateway es la puerta de entrada (el controlador lo instaló
# antes scripts/instalar-gateway.ts); la HTTPRoute es lo que escribe el desarrollador.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo
  namespace: s11
spec:
  gatewayClassName: eg          # la crea scripts/instalar-gateway.ts
  listeners:
    - { name: http, protocol: HTTP, port: 80 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: s11
spec:
  parentRefs:
    - name: demo                # se engancha al Gateway de arriba
  rules:
    - matches:
        - path: { type: PathPrefix, value: /cotizacion }
      backendRefs:
        - { name: api, port: 80 }          # puerto del Service, no del contenedor
    - matches:
        - path: { type: PathPrefix, value: /precios }
      backendRefs:
        - { name: precios, port: 3001 }

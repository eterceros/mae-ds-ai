# KA: manifiestos tal como los devolvió un asistente de IA ante el pedido
#   "convert the api and precios services of my compose.yaml to Kubernetes manifests"
# SIN revisar. Parecen correctos. No se corrigen aquí: la idea es ver qué detecta cada herramienta
# (ver DIFERENCIAS.md). La versión revisada está en ../despues/.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: s11-ka
data:
  PRECIOS_URL: http://precios:3001
  PORT: "3000"                           # número, no texto
  DEBUG: "true"                          # booleano, no texto
---
apiVersion: v1
kind: Secret
metadata:
  name: api-secretos
  namespace: s11-ka
type: Opaque
data:
  API_KEY: ZGVtby1jbGF2ZS12MQ==               # texto plano en "data:" (espera base64), y en el repo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: s11-ka
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api                # no coincide con el selector
    spec:
      containers:
        - name: api
          image: s11-demo/api:latest
          ports:
            - containerPort: 3000
          env:
            - name: API_KEY
              value: "demo-clave-v1"     # secreto escrito como valor literal
          livenessProbe:                # errata
            httpGet:
              path: /salud
              port: 3000
          resources:
            limits:
              memory: 256Mi            # no es una cantidad válida
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: s11-ka
spec:
  type: LoadBalancer
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8080                 # el contenedor escucha en 3000
      protocol: TCP                   # solo TCP, UDP o SCTP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: precios
  namespace: s11-ka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: precios
  template:
    metadata:
      labels:
        app: precios
    spec:
      containers:
        - name: precios
          image: s11-demo/precios
          ports:
            - containerPort: 3001
          readinessProbe:
            httpGet:
              path: /health            # la app expone /salud
              port: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: precios
  namespace: s11-ka
spec:
  selector:
    app: prices                        # ningún pod tiene esta etiqueta
  ports:
    - port: 3001

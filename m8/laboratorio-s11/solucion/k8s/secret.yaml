# Solución del docente · Secret del servicio de ejemplo.
# Un Secret está codificado en base64, NO cifrado: quien pueda leerlo en el
# clúster lo decodifica. Este archivo lleva un valor FALSO a propósito; el
# real se crea desde la máquina, sin archivo (ver solucion/README.md):
#   kubectl create secret generic ejemplo-api-secret --from-literal=API_KEY=valor-real
apiVersion: v1
kind: Secret
metadata:
  # RESUELTO (TODO nombre): <nombre-del-servicio>-secret. Es el que usa el
  # volumen "secretos" de deployment.yaml (secretName).
  name: ejemplo-api-secret
  labels:
    app: ejemplo-api
type: Opaque
stringData:
  # RESUELTO (TODO clave): la única clave secreta que lee server.mjs. Montado
  # como archivo (opción B), cada clave se vuelve un archivo con ese nombre:
  # /etc/secretos/API_KEY. Valor falso: no es una clave real de nada.
  API_KEY: "clave-falsa-del-laboratorio"

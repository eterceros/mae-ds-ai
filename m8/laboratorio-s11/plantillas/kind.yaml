# Clúster kind del laboratorio S11: un solo nodo (plano de control + cargas).
# Se crea con:
#   kind create cluster --name lab-s11 --config kind.yaml
# No se publica ningún puerto: al servicio se llega con `kubectl port-forward`.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane

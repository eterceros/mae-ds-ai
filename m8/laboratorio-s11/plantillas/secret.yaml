# Secret: contraseñas, claves y tokens que necesita su servicio.
# Ojo: un Secret está codificado en base64, NO cifrado. Quien pueda leerlo en
# el clúster lo decodifica. No suban valores reales al repositorio: suban este
# archivo con valores falsos y creen el Secret real desde su máquina (README).
apiVersion: v1
kind: Secret
metadata:
  # TODO: <nombre-del-servicio>-secret
  name: TODO_NOMBRE_SERVICIO-secret
type: Opaque
# stringData recibe texto plano; Kubernetes lo guarda codificado en base64.
stringData:
  # TODO: una clave por cada valor secreto. En el laboratorio, valores falsos.
  TODO_CLAVE_SECRETA: "TODO_VALOR_FALSO"
